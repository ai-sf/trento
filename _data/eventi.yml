    - image: science_no_gender_mar26.jpg
      title: Science has no gender
      text: "Chi ha paura delle STEM?
            In occasione della Giornata Internazionale della Donna, AISF Trento e Spettro di Povo organizzano un incontro formativo sull'ansia da STEM, in cui interverranno professori e ricercatori dell'Università di Trento, riportando dati ed esperienze personali, con focus su dinamiche di genere e bias relativi alla popolazione femminile.
            Interverrano il prof. Massimiliano Rinaldi (delegato RuniPace dell'ateneo), la dott. Emma Franchino (ricercatrice in Scienze Cognitive presso il Dip. di Fisica) e la prof. Barbara Poggio (prorettrice alle politiche di equità e diversità dell’ateneo).
            🗓 Martedì 10 marzo
            🕒 ore 20:30
            📍 Sala conferenze della Fondazione Caritro, via Calepina 1, Trento
            Vi aspettiamo!"
      linktxt: 
