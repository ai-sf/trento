    - image: B&P_feb26.jpg
      title: Beer & Physics 2026
      text: "🍻 AISF Trento torna con il primo Beer & Physics del 2026!
            ⚛️ Questa volta, ci faremo svelare dal prof. Lorenzo Pavesi i dettagli di un suo lavoro sui chip fotonici che sfruttano l'entanglement, e il prof. Valter Moretti ci aiuterà a capire la teoria che si nasconde dietro questi dispositivi.
            🍽 L'evento è parte di TIQIT26, quindi è possibile partecipare al buffet che lo precede (a base di prodotti tipici trentini), prenotandosi al modulo che trovate al link in bio, al prezzo di 16€.
            ❗️Poiché TIQIT è un evento internazionale, la conferenza si terrà in lingua inglese.
            🗓 Giovedì 26 febbraio
            🕑 Ore 20:30
            📍 Locanda del Gatto Gordo
            Vi aspettiamo numerosi!"
